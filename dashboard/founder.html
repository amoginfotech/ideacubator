<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Ideacubator</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../ideacubator.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR CONTAINER -->
    <div id="navbar-container"></div>

    <!-- DASHBOARD CONTENT -->
    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="section__title mb-4">My Dashboard</h1>

                <!-- Loading State -->
                <div id="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Loading your data...</p>
                </div>

                <!-- Applications List -->
                <div id="noApplications" class="alert alert-info" style="display: none;">
                    <h5>No Applications Found</h5>
                    <p>You haven't submitted an application yet.</p>
                    <a href="../index.html#apply" class="btn btn--primary">Start Your Application</a>
                </div>
                <div id="applicationsList" class="card" style="display: none;">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Profile Type</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="appsTableBody">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Application Details Modal -->
    <div class="modal fade" id="appDetailModal" tabindex="-1" aria-labelledby="appDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appDetailModalLabel">Application Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appDetailContent">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDHPuZ7fAXInpVSPF5Ki7qJwBYfRUlJ2A4",
            authDomain: "rational-world-330006.firebaseapp.com",
            projectId: "rational-world-330006",
            storageBucket: "rational-world-330006.firebasestorage.app",
            messagingSenderId: "115200442212",
            appId: "1:115200442212:web:b2cd9d4d48738da9ed4471"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM Elements
        const loadingEl = document.getElementById('loading');
        const noApplicationsEl = document.getElementById('noApplications');
        const applicationsListEl = document.getElementById('applicationsList');
        const appsTableBody = document.getElementById('appsTableBody');
        const appDetailModal = new bootstrap.Modal(document.getElementById('appDetailModal'));
        const appDetailContent = document.getElementById('appDetailContent');

        // Track current user for navbar UI
        let currentUser = null;

        // Update navbar buttons based on auth state
        function updateNavbarAuthUI(user) {
            const dashboardLink = document.querySelector('.nav__dashboard-link');
            const logoutBtn = document.getElementById('logoutBtn');
            const loginBtn = document.getElementById('loginBtn');
            const userNameDisplay = document.getElementById('userNameDisplay');

            if (!dashboardLink || !logoutBtn || !loginBtn) return; // Navbar not loaded yet

            if (user) {
                dashboardLink.style.display = 'inline-flex';
                logoutBtn.style.display = 'inline-flex';
                loginBtn.style.display = 'none';
                if (userNameDisplay) {
                    const name = user.displayName || user.email.split('@')[0];
                    userNameDisplay.textContent = name;
                    userNameDisplay.style.display = 'inline';
                }
            } else {
                dashboardLink.style.display = 'none';
                logoutBtn.style.display = 'none';
                loginBtn.style.display = 'inline-flex';
                if (userNameDisplay) {
                    userNameDisplay.style.display = 'none';
                }
            }
        }

        // Load navbar
        fetch('../navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                // Set up logout button after navbar is loaded
                const logoutBtn = document.getElementById('logoutBtn');
                logoutBtn?.addEventListener('click', async () => {
                    await auth.signOut();
                    window.location.href = '../index.html';
                });
                // Apply current auth state to navbar
                updateNavbarAuthUI(currentUser);
            })
            .catch(err => console.error('Failed to load navbar:', err));

        function getStatusBadge(status) {
            const badges = {
                'submitted': 'bg-info',
                'under_review': 'bg-warning text-dark',
                'meeting_scheduled': 'bg-primary',
                'due_diligence': 'bg-primary',
                'approved': 'bg-success',
                'rejected': 'bg-danger',
                'invested': 'bg-success',
                'incubation': 'bg-info',
                'closed': 'bg-secondary'
            };
            const label = status ? status.replace('_', ' ') : '-';
            return `<span class="badge ${badges[status] || 'bg-secondary'}">${label}</span>`;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            return timestamp.toDate().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Show application details (read-only) from data attribute
        window.showApplicationFromEncoded = function (btn) {
            const encoded = btn.getAttribute('data-app');
            if (!encoded) return;
            try {
                const appData = JSON.parse(decodeURIComponent(encoded));
                buildReadOnlyApplicationDetails(appData);
                appDetailModal.show();
            } catch (err) {
                console.error('Error displaying application:', err);
                alert('Failed to load application details.');
            }
        };

        // Build read-only application details
        function buildReadOnlyApplicationDetails(data) {
            let html = `<div class="row g-3">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Application Details</h5>
                        ${getStatusBadge(data.status || 'submitted')}
                    </div>
                    <table class="table table-sm table-dark">
                        <tr><td style="width: 25%;"><strong>Application ID:</strong></td><td>${data.id || 'N/A'}</td></tr>
                        <tr><td><strong>Profile:</strong></td><td>${data.profileSelected || 'N/A'}</td></tr>
                        <tr><td><strong>Submitted:</strong></td><td>${formatDate(data.submittedAt)}</td></tr>
                    </table>

                    <h6 class="border-bottom pb-2 mt-3">Founder Information</h6>
                    <table class="table table-sm table-dark">
                        <tr><td style="width: 25%;"><strong>Full Name:</strong></td><td>${data.founderName || '-'}</td></tr>
                        <tr><td><strong>Email:</strong></td><td>${data.founderEmail || '-'}</td></tr>
                        <tr><td><strong>Phone:</strong></td><td>${data.founderPhone || '-'}</td></tr>
                        <tr><td><strong>LinkedIn:</strong></td><td>${data.founderLinkedIn || '-'}</td></tr>
                    </table>

                    <h6 class="border-bottom pb-2 mt-3">Application Data</h6>
                    <table class="table table-sm table-dark">
                        ${Object.keys(data).filter(k => !['id', 'founderName', 'founderEmail', 'founderPhone', 'founderLinkedIn', 'profileSelected', 'status', 'submittedAt', 'source', 'govCheck', 'reviewerComments', 'reviewedAt', 'rating'].includes(k)).map(key => `
                            <tr><td style="width: 25%;"><strong>${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</strong></td><td>${Array.isArray(data[key]) ? data[key].join(', ') : data[key]}</td></tr>
                        `).join('')}
                    </table>

                    ${data.reviewerComments ? `
                        <h6 class="border-bottom pb-2 mt-3">Reviewer Comments</h6>
                        <div class="bg-dark p-3 rounded mb-3" style="font-size: 0.9rem;">${data.reviewerComments}</div>
                    ` : ''}
                </div>
            </div>`;
            appDetailContent.innerHTML = html;
        }

        // Show editable application form (only for submitted/under_review status)
        window.showEditableApplication = function (btn) {
            const encoded = btn.getAttribute('data-app');
            const docId = btn.getAttribute('data-doc-id');
            if (!encoded || !docId) return;
            try {
                const appData = JSON.parse(decodeURIComponent(encoded));
                buildEditableApplicationForm(appData, docId);
                appDetailModal.show();
            } catch (err) {
                console.error('Error displaying application:', err);
                alert('Failed to load application details.');
            }
        };

        // Build editable application form (excludes personal info)
        function buildEditableApplicationForm(data, docId) {
            const excludeFields = ['id', 'founderName', 'founderEmail', 'founderPhone', 'founderLinkedIn', 'profileSelected', 'status', 'submittedAt', 'source', 'govCheck', 'reviewerComments', 'reviewedAt', 'rating'];
            const editableFields = Object.keys(data).filter(k => !excludeFields.includes(k) && data[k]);

            let html = `<form id="editApplicationForm">
                <div class="mb-3">
                    <label class="form-label small text-muted">Profile Type</label>
                    <input type="text" class="form-control" value="${data.profileSelected || ''}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Current Status</label>
                    <div>${getStatusBadge(data.status || 'submitted')}</div>
                </div>`;

            if (editableFields.length > 0) {
                html += `<h6 class="border-bottom pb-2">Application Details (Editable)</h6>`;
                editableFields.forEach(field => {
                    const label = field.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    const value = Array.isArray(data[field]) ? data[field].join(', ') : data[field];
                    html += `
                        <div class="mb-3">
                            <label class="form-label">${label}</label>
                            <input type="text" class="form-control" name="${field}" value="${value.replace(/"/g, '&quot;')}">
                        </div>
                    `;
                });
            } else {
                html += `<p class="text-muted">No editable fields found.</p>`;
            }

            html += `
                <div class="mb-3">
                    <label class="form-label">Additional Notes / Changes</label>
                    <textarea class="form-control" name="founderNotes" rows="3" placeholder="Add any notes or requested changes..."></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn--outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn--primary">Save Changes</button>
                </div>
            </form>`;

            appDetailContent.innerHTML = html;

            // Attach form handler
            const form = document.getElementById('editApplicationForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await saveApplicationChanges(docId, form);
                });
            }
        }

        // Save application changes
        async function saveApplicationChanges(docId, form) {
            try {
                const updateData = {};
                const formData = new FormData(form);
                formData.forEach((value, key) => {
                    if (key !== 'founderNotes') {
                        updateData[key] = value;
                    }
                });

                // Add update timestamp
                updateData.updatedAt = firebase.firestore.FieldValue.serverTimestamp();

                await firebase.firestore().collection('applications').doc(docId).update(updateData);

                // Show success message
                alert('Application updated successfully!');
                appDetailModal.hide();

                // Refresh table
                loadData();
            } catch (err) {
                console.error('Error updating application:', err);
                alert('Failed to update application: ' + err.message);
            }
        }

        // Load data for current user
        async function loadData() {
            const user = currentUser;
            if (!user) return;

            loadingEl.style.display = 'block';
            noApplicationsEl.style.display = 'none';
            applicationsListEl.style.display = 'none';

            try {
                // Load user's applications (where founderEmail === user.email)
                const appsSnapshot = await db.collection('applications')
                    .where('founderEmail', '==', user.email)
                    .orderBy('submittedAt', 'desc')
                    .get();

                loadingEl.style.display = 'none';

                if (appsSnapshot.empty) {
                    // No applications
                    noApplicationsEl.style.display = 'block';
                    applicationsListEl.style.display = 'none';
                } else {
                    // Has applications - show table
                    noApplicationsEl.style.display = 'none';
                    applicationsListEl.style.display = 'block';
                    appsTableBody.innerHTML = appsSnapshot.docs.map(doc => {
                        const data = doc.data();
                        const encoded = encodeURIComponent(JSON.stringify(data));
                        const canEdit = !data.status || data.status === 'submitted' || data.status === 'under_review';
                        return `
                            <tr>
                                <td>${formatDate(data.submittedAt)}</td>
                                <td>${data.profileSelected}</td>
                                <td>${getStatusBadge(data.status || 'new')}</td>
                                <td>
                                    ${canEdit ?
                                        `<button class="btn btn-sm btn--primary"
                                                data-app="${encoded}"
                                                data-doc-id="${doc.id}"
                                                onclick="showEditableApplication(this)">
                                            Edit
                                        </button>` :
                                        `<button class="btn btn-sm btn--outline"
                                                data-app="${encoded}"
                                                data-doc-id="${doc.id}"
                                                onclick="showApplicationFromEncoded(this)"
                                                disabled>
                                            View
                                        </button>`
                                    }
                                </td>
                            </tr>
                        `;
                    }).join('');
                }

            } catch (err) {
                console.error('Error loading data:', err);
                loadingEl.innerHTML = '<p class="text-danger">Error loading data. Please refresh or try again.</p>';
            }
        }

        // Auth state change handler
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;

            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            // Update navbar UI
            updateNavbarAuthUI(user);

            // Load user data
            await loadData();
        });
    </script>
</body>

</html>
