<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ideacubator</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../ideacubator.css" rel="stylesheet">
</head>

<body>

    <!-- LOGIN FORM (shown if not authenticated) -->
    <div id="loginForm" class="login-container" style="display: none;">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Admin Login</h3>
                <form id="adminLogin">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn--primary w-100">Login</button>
                    <div class="mt-3 small text-muted text-center">
                        Contact the system administrator for credentials.
                    </div>
                </form>
                <div id="loginError" class="alert alert-danger mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (shown if authenticated) -->
    <div id="dashboard" style="display: none;">
        <!-- NAVBAR CONTAINER -->
        <div id="navbar-container"></div>

        <!-- DASHBOARD CONTENT -->
        <div class="container" style="padding-top: calc(var(--nav-h) + 1.5rem); padding-bottom: 2rem;">
            <div class="row">
                <div class="col-12">
                    <h1 class="section__title mb-4">Admin Dashboard</h1>

                    <!-- Loading State -->
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Loading data...</p>
                    </div>

                    <!-- Stats Row -->
                    <div class="row g-3 mb-4" id="statsRow" style="display: none;">
                        <div class="col-md-3">
                            <div class="stat-card stat-card--elevated">
                                <div class="number" id="statApplications">0</div>
                                <div class="label">Total Applications</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statInvestors">0</div>
                                <div class="label">Investor Inquiries</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statPending">0</div>
                                <div class="label">Pending Reviews</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statApproved">0</div>
                                <div class="label">Approved (This Month)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist" style="display: none;">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="applications-tab" data-bs-toggle="tab"
                                data-bs-target="#applications" type="button">Applications</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="investors-tab" data-bs-toggle="tab" data-bs-target="#investors"
                                type="button">Investor Inquiries</button>
                        </li>
                    </ul>

                    <!-- Tab Content -->
                    <div class="tab-content" id="adminTabContent" style="display: none;">
                        <!-- Applications Tab -->
                        <div class="tab-pane fade show active" id="applications" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <!-- Filters -->
                                    <div class="row g-2 mb-3" id="appFilters">
                                        <div class="col-md-3">
                                            <label class="form-label small text-muted">Status</label>
                                            <select class="form-select form-select-sm" id="filterStatus">
                                                <option value="all">All Statuses</option>
                                                <option value="submitted">Submitted</option>
                                                <option value="under_review">Under Review</option>
                                                <option value="meeting_scheduled">Meeting Scheduled</option>
                                                <option value="due_diligence">Due Diligence</option>
                                                <option value="approved">Approved</option>
                                                <option value="rejected">Rejected</option>
                                                <option value="invested">Invested</option>
                                                <option value="incubation">Incubation</option>
                                                <option value="closed">Closed</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label small text-muted">Rating</label>
                                            <select class="form-select form-select-sm" id="filterRating">
                                                <option value="all">All Ratings</option>
                                                <option value="5">5 Stars</option>
                                                <option value="4">4+ Stars</option>
                                                <option value="3">3+ Stars</option>
                                                <option value="2">2+ Stars</option>
                                                <option value="1">1+ Stars</option>
                                                <option value="0">No Rating</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 d-flex align-items-end">
                                            <button class="btn btn--primary btn-sm" onclick="applyFilters()">Apply Filters</button>
                                            <button class="btn btn--outline btn-sm ms-2" onclick="clearFilters()">Clear</button>
                                        </div>
                                    </div>

                                    <div class="table-responsive">
                                        <table class="table table-dark table-hover table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Profile</th>
                                                    <th>Rating</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="applicationsTableBody">
                                                <!-- Populated by JS -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Investors Tab -->
                        <div class="tab-pane fade" id="investors" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-dark table-hover table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Company</th>
                                                    <th>Range</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="investorsTableBody">
                                                <!-- Populated by JS -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Detail Modal -->
    <div class="modal fade" id="appDetailModal" tabindex="-1" aria-labelledby="appDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appDetailModalLabel">Application Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appDetailContent">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../ideacubator.js"></script>
    <script>
        // Initialize Firebase if not already
        if (!firebase.apps.length) {
            firebase.initializeApp({
                apiKey: "AIzaSyDHPuZ7fAXInpVSPF5Ki7qJwBYfRUlJ2A4",
                authDomain: "rational-world-330006.firebaseapp.com",
                projectId: "rational-world-330006",
                storageBucket: "rational-world-330006.firebasestorage.app",
                messagingSenderId: "115200442212",
                appId: "1:115200442212:web:b2cd9d4d48738da9ed4471"
            });
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Admin authentication via Email/Password with Firebase Custom Claims
        // Admin users must have the custom claim `admin: true` set via Cloud Functions
        // See functions/src/index.ts for setAdminClaim function

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const dashboard = document.getElementById('dashboard');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const loadingEl = document.getElementById('loading');
        const statsRow = document.getElementById('statsRow');
        const adminTabs = document.getElementById('adminTabs');
        const adminTabContent = document.getElementById('adminTabContent');
        const applicationsTableBody = document.getElementById('applicationsTableBody');
        const investorsTableBody = document.getElementById('investorsTableBody');
        const appDetailModal = new bootstrap.Modal(document.getElementById('appDetailModal'));
        const appDetailContent = document.getElementById('appDetailContent');

        // Auth State
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // User is authenticated, show dashboard
                showDashboard();
            } else {
                // No user, show login
                showLogin();
            }
        });

        // Auto logout when leaving admin page (navigate to index.html or other site)
        window.addEventListener('beforeunload', async () => {
            try {
                await auth.signOut();
            } catch (e) {
                console.error('Error signing out on page leave:', e);
            }
        });

        // Login form submit (Firebase Email/Password)
        document.getElementById('adminLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Auth state handler will check whitelist and show dashboard if authorized
            } catch (err) {
                // Simplify common Firebase error message
                if (err.code === 'auth/invalid-credential') {
                    loginError.textContent = 'The supplied auth credential is incorrect';
                } else {
                    loginError.textContent = err.message || 'Login failed';
                }
                loginError.style.display = 'block';
            }
        });

        // Logout
        logoutBtn?.addEventListener('click', async () => {
            await auth.signOut();
            showLogin();
        });

        function showLogin() {
            loginForm.style.display = 'flex';
            dashboard.style.display = 'none';
            loginError.style.display = 'none';
        }

        function showDashboard() {
            loginForm.style.display = 'none';
            dashboard.style.display = 'block';
            loadData();
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            let date;
            try {
                // Firestore Timestamp
                if (timestamp.toDate && typeof timestamp.toDate === 'function') {
                    date = timestamp.toDate();
                } else if (timestamp instanceof Date) {
                    date = timestamp;
                } else if (typeof timestamp === 'string' || typeof timestamp === 'number') {
                    date = new Date(timestamp);
                } else {
                    return '-';
                }
                if (isNaN(date.getTime())) return '-';
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch (e) {
                console.error('Error formatting date:', e);
                return '-';
            }
        }

        function getStatusBadge(status) {
            const badges = {
                'submitted': 'bg-info',
                'under_review': 'bg-warning text-dark',
                'meeting_scheduled': 'bg-primary',
                'due_diligence': 'bg-primary',
                'approved': 'bg-success',
                'rejected': 'bg-danger',
                'invested': 'bg-success',
                'incubation': 'bg-info',
                'closed': 'bg-secondary'
            };
            const label = status ? status.replace('_', ' ') : '-';
            return `<span class="badge ${badges[status] || 'bg-secondary'}">${label}</span>`;
        }

        async function showApplicationDetails(docId) {
            await showDetailsModal('Application Details', 'applications', docId);
        }

        async function showInvestorDetails(docId) {
            await showDetailsModal('Investor Inquiry Details', 'investorInquiries', docId);
        }

        async function showDetailsModal(title, collection, docId) {
            try {
                const doc = await firebase.firestore().collection(collection).doc(docId).get();
                if (!doc.exists) {
                    alert('Record not found');
                    return;
                }
                const data = doc.data();
                data.id = doc.id;

                // Update modal title
                document.getElementById('appDetailModalLabel').textContent = title;

                let html = '';

                if (collection === 'applications') {
                    html = buildApplicationDetails(data);
                } else if (collection === 'investorInquiries') {
                    html = buildInvestorDetails(data);
                }

                appDetailContent.innerHTML = html;
                appDetailModal.show();

                if (collection === 'applications') {
                    attachReviewFormHandlers(docId, data);
                }
            } catch (err) {
                console.error(`Error loading ${collection}:`, err);
                alert('Failed to load details');
            }
        }

        function buildApplicationDetails(data) {
            const statusOptions = ['submitted', 'under_review', 'meeting_scheduled', 'due_diligence', 'approved', 'rejected', 'invested', 'incubation', 'closed'];
            const rating = parseInt(data.rating) || 0;

            let html = `
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <h4 class="mb-0">Application Details</h4>
                        <div id="starRating" class="d-flex align-items-center gap-1" data-doc-id="${data.id}">
                            ${[1,2,3,4,5].map(n => `
                                <i class="bi bi-star${n <= rating ? '-fill' : ''} star-icon text-warning"
                                   style="cursor: pointer; font-size: 1.1rem;"
                                   data-rating="${n}"
                                   title="${n} star${n > 1 ? 's' : ''}"></i>
                            `).join('')}
                        </div>
                    </div>
                    ${getStatusBadge(data.status || 'submitted')}
                </div>

                <table class="table table-sm table-dark mb-4">
                    <tr><td style="width: 25%;"><strong>Application ID:</strong></td><td>${data.id}</td></tr>
                    <tr><td><strong>Profile:</strong></td><td>${data.profileSelected || 'N/A'}</td></tr>
                    <tr><td><strong>Submitted:</strong></td><td>${formatDate(data.submittedAt)}</td></tr>
                </table>

                <h6 class="border-bottom pb-2 mb-3">Founder Information</h6>
                <table class="table table-sm table-dark mb-4">
                    <tr><td style="width: 25%;"><strong>Full Name:</strong></td><td>${data.founderName || '-'}</td></tr>
                    <tr><td><strong>Email:</strong></td><td>${data.founderEmail || '-'}</td></tr>
                    <tr><td><strong>Phone:</strong></td><td>${data.founderPhone || '-'}</td></tr>
                    <tr><td><strong>LinkedIn:</strong></td><td>${data.founderLinkedIn || '-'}</td></tr>
                </table>`;

            // Profile-specific fields
            const exclude = ['founderName', 'founderEmail', 'founderPhone', 'founderLinkedIn', 'profileSelected', 'status', 'submittedAt', 'source', 'id', 'govCheck'];
            const profileFields = Object.keys(data).filter(k => !exclude.includes(k) && data[k]);

            if (profileFields.length > 0) {
                html += `<h6 class="border-bottom pb-2 mb-3">Application Details</h6>
                    <table class="table table-sm table-dark mb-4">`;
                profileFields.forEach(field => {
                    const label = field.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    const value = Array.isArray(data[field]) ? data[field].join(', ') : data[field];
                    html += `<tr><td style="width: 25%;"><strong>${label}:</strong></td><td>${value}</td></tr>`;
                });
                html += `</table>`;
            }

            // Reviewer Comments - full width
            html += `<h6 class="border-bottom pb-2 mb-3">Reviewer Comments</h6>
                <textarea class="form-control mb-4" id="reviewComments" name="comments" rows="4" style="min-height: 120px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); font-family: var(--font-body);" placeholder="Add internal notes...">${data.reviewerComments || ''}</textarea>`;

            // Review Form - status selector and save button at bottom
            html += `<div class="card bg-dark border-secondary mb-3">
                <div class="card-body">
                    <form id="reviewForm" class="d-flex gap-2 align-items-end">
                        <div class="flex-grow-1">
                            <label class="form-label small text-muted mb-1">Update Status</label>
                            <select class="form-select form-select-sm" id="reviewStatus" name="status" style="padding: 0.35rem 0.75rem; font-size: 0.875rem;">`;
            statusOptions.forEach(opt => {
                html += `<option value="${opt}" ${data.status === opt ? 'selected' : ''}>${opt.replace('_', ' ')}</option>`;
            });
            html += `      </select>
                        </div>
                        <button type="submit" class="btn btn--primary btn-sm" style="padding: 0.35rem 1rem; font-size: 0.875rem; white-space: nowrap;">Save Review</button>
                    </form>
                    <div id="reviewSuccess" class="alert alert-success mt-2 py-2 px-3" style="display: none; font-size: 0.85rem;"></div>
                    <div id="reviewError" class="alert alert-danger mt-2 py-2 px-3" style="display: none; font-size: 0.85rem;"></div>
                </div>
            </div>`;

            return html;
        }

        function buildInvestorDetails(data) {
            const investorFields = Object.keys(data).filter(k => !['id', 'submittedAt', 'status', 'reviewedAt'].includes(k)).sort();

            let html = `<div class="row">
                <div class="col-12">
                    <h6 class="border-bottom pb-2">Inquiry Information</h6>
                    <table class="table table-sm table-dark">
                        <tr><td style="width: 30%;"><strong>Inquiry ID:</strong></td><td>${data.id}</td></tr>
                        <tr><td><strong>Status:</strong></td><td>${getStatusBadge(data.status || 'pending')}</td></tr>
                        <tr><td><strong>Submitted:</strong></td><td>${formatDate(data.submittedAt)}</td></tr>
                    </table>`;

            if (investorFields.length > 0) {
                html += `<h6 class="border-bottom pb-2 mt-4">Investor Information</h6>
                    <table class="table table-sm table-dark">`;
                investorFields.forEach(key => {
                    const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    const value = Array.isArray(data[key]) ? data[key].join(', ') : (data[key] || '-');
                    html += `<tr><td style="width: 30%;"><strong>${label}:</strong></td><td>${value}</td></tr>`;
                });
                html += `</table>`;
            }

            html += `</div></div>`;
            return html;
        }

        function attachReviewFormHandlers(docId, data) {
            const form = document.getElementById('reviewForm');
            if (!form) return;
            // Store original data to refresh modal after save
            form.dataset.docId = docId;
            form.dataset.originalStatus = data.status || 'submitted';

            // Star rating click handler
            const starContainer = document.getElementById('starRating');
            if (starContainer) {
                starContainer.addEventListener('click', async (e) => {
                    if (e.target.classList.contains('star-icon')) {
                        const rating = parseInt(e.target.dataset.rating);
                        // Update visual state
                        const stars = starContainer.querySelectorAll('.star-icon');
                        stars.forEach((star, idx) => {
                            star.classList.toggle('bi-star-fill', idx < rating);
                            star.classList.toggle('bi-star', idx >= rating);
                        });

                        // Save to database
                        try {
                            await firebase.firestore().collection('applications').doc(docId)
                                .update({ rating: rating });
                            console.log('Rating saved:', rating);
                        } catch (err) {
                            console.error('Error saving rating:', err);
                        }
                    }
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const status = document.getElementById('reviewStatus').value;
                const comments = document.getElementById('reviewComments').value;

                const successEl = document.getElementById('reviewSuccess');
                const errorEl = document.getElementById('reviewError');
                successEl.style.display = 'none';
                errorEl.style.display = 'none';

                try {
                    await updateApplicationStatus(docId, status, comments);
                    successEl.textContent = '✓ Review saved & status updated';
                    successEl.style.display = 'block';

                    // Update status badge in header
                    const header = document.querySelector('.modal-title').parentElement;
                    const existingBadge = header.querySelector('.badge');
                    if (existingBadge) {
                        existingBadge.replaceWith(createStatusBadge(status));
                    } else {
                        header.insertAdjacentElement('afterbegin', createStatusBadge(status));
                    }

                    setTimeout(() => successEl.style.display = 'none', 5000);
                } catch (err) {
                    errorEl.textContent = 'Failed to save: ' + err.message;
                    errorEl.style.display = 'block';
                }
            });
        }

        function renderApplicationsTable(apps) {
            applicationsTableBody.innerHTML = apps.map(app => {
                const rating = parseInt(app.rating) || 0;
                const stars = [1,2,3,4,5].map(n =>
                    `<i class="bi bi-star${n <= rating ? '-fill' : ''} text-warning" style="font-size: 0.9rem;"></i>`
                ).join('');
                return `
                    <tr>
                        <td>${formatDate(app.submittedAt)}</td>
                        <td>${app.founderName || app.founderEmail || 'Anonymous'}</td>
                        <td>${app.founderEmail || '-'}</td>
                        <td>${app.profileSelected || '-'}</td>
                        <td style="text-align: center; min-width: 120px;">${stars}</td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateApplicationStatus('${app.id}', this.value)" style="width: auto; display: inline-block;">
                                <option value="submitted" ${app.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                                <option value="under_review" ${app.status === 'under_review' ? 'selected' : ''}>Under Review</option>
                                <option value="meeting_scheduled" ${app.status === 'meeting_scheduled' ? 'selected' : ''}>Meeting Scheduled</option>
                                <option value="due_diligence" ${app.status === 'due_diligence' ? 'selected' : ''}>Due Diligence</option>
                                <option value="approved" ${app.status === 'approved' ? 'selected' : ''}>Approved</option>
                                <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                <option value="invested" ${app.status === 'invested' ? 'selected' : ''}>Invested</option>
                                <option value="incubation" ${app.status === 'incubation' ? 'selected' : ''}>Incubation</option>
                                <option value="closed" ${app.status === 'closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-sm btn--outline" onclick='showApplicationDetails("${app.id}")'>Details</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function applyFilters() {
            const statusFilter = document.getElementById('filterStatus').value;
            const ratingFilter = document.getElementById('filterRating').value;

            let filtered = allApplications;

            // Filter by status
            if (statusFilter !== 'all') {
                filtered = filtered.filter(app => app.status === statusFilter);
            }

            // Filter by rating
            if (ratingFilter !== 'all') {
                const minRating = parseInt(ratingFilter);
                filtered = filtered.filter(app => {
                    const rating = parseInt(app.rating) || 0;
                    if (ratingFilter === '0') {
                        return rating === 0;
                    }
                    return rating >= minRating;
                });
            }

            renderApplicationsTable(filtered);
        }

        function clearFilters() {
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterRating').value = 'all';
            renderApplicationsTable(allApplications);
        }

        function createStatusBadge(status) {
            const badge = document.createElement('span');
            badge.className = 'badge ' + (status === 'approved' ? 'bg-success' : status === 'rejected' ? 'bg-danger' : 'bg-info');
            badge.textContent = status.replace('_', ' ').toUpperCase();
            return badge;
        }

        async function updateApplicationStatus(docId, newStatus, comments = null) {
            try {
                const updateData = {
                    status: newStatus,
                    reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                if (comments !== undefined && comments !== null && comments.trim() !== '') {
                    updateData.reviewerComments = comments.trim();
                } else if (comments === '' || comments === null) {
                    // If comments are explicitly empty, we could remove the field (optional)
                    // updateData.reviewerComments = firebase.firestore.FieldValue.delete();
                }

                await firebase.firestore().collection('applications').doc(docId).update(updateData);

                // Note: We don't refresh the table automatically here to avoid closing the modal
                // The user can refresh manually or we could add the new status to the badge
            } catch (err) {
                console.error('Error updating application:', err);
                throw err;
            }
        }

        async function updateInvestorStatus(inqDocId, status) {
            try {
                await firebase.firestore().collection('investorInquiries').doc(inqDocId).update({ status, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
                alert(`Investor ${status}`);
                loadData();
            } catch (err) {
                console.error('Error updating investor:', err);
                alert('Failed to update status');
            }
        }

        // Store raw data for filtering
        let allApplications = [];

        async function loadData() {
            try {
                console.log('Loading data from Firestore...');
                const [appsSnap, investorsSnap] = await Promise.all([
                    firebase.firestore().collection('applications').orderBy('submittedAt', 'desc').get(),
                    firebase.firestore().collection('investorInquiries').orderBy('submittedAt', 'desc').get()
                ]);

                console.log('Applications count:', appsSnap.size);
                console.log('Investor inquiries count:', investorsSnap.size);
                console.log('Investor inquiry sample:', investorsSnap.docs.length > 0 ? investorsSnap.docs[0].data() : 'No data');

                // Store raw applications data for filtering
                allApplications = appsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Apply any active filters
                renderApplicationsTable(allApplications);

                // Stats - count applications by status (use all data, not filtered)
                const apps = allApplications;
                const pendingCount = apps.filter(a => !a.status || a.status === 'submitted' || a.status === 'pending').length;

                // Approved this month (based on submittedAt timestamp)
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const approvedThisMonth = apps.filter(app => {
                    if (app.status !== 'approved') return false;
                    if (!app.submittedAt) return false;
                    const date = app.submittedAt.toDate ? app.submittedAt.toDate() : new Date(app.submittedAt);
                    return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
                }).length;

                document.getElementById('statApplications').textContent = appsSnap.size;
                document.getElementById('statInvestors').textContent = investorsSnap.size;
                document.getElementById('statPending').textContent = pendingCount;
                document.getElementById('statApproved').textContent = approvedThisMonth;

                // Applications table is now rendered by renderApplicationsTable()

                // Investors table
                console.log('Investor inquiries data sample:', investorsSnap.docs.map(d => d.data()));
                investorsTableBody.innerHTML = investorsSnap.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <tr>
                            <td>${formatDate(data.submittedAt)}</td>
                            <td>${data.name || data.fullName || data.investorName || '-'}</td>
                            <td>${data.email || data.investorEmail || '-'}</td>
                            <td>${data.company || '-'}</td>
                            <td>${data.investmentRange || data.range || '-'}</td>
                            <td>${getStatusBadge(data.status || 'pending')}</td>
                            <td>
                                <button class="btn btn-sm btn--outline me-1" onclick='showInvestorDetails("${doc.id}")'>Details</button>
                                ${(!data.status || data.status === 'pending') ? `
                                    <button class="btn btn-sm btn-success" onclick="updateInvestorStatus('${doc.id}', 'approved')">Approve</button>
                                    <button class="btn btn-sm btn-danger" onclick="updateInvestorStatus('${doc.id}', 'rejected')">Reject</button>
                                ` : '<span class="text-muted">-</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');

                loadingEl.style.display = 'none';
                statsRow.style.display = 'flex';
                adminTabs.style.display = 'flex';
                adminTabContent.style.display = 'block';

            } catch (err) {
                console.error('Error loading data:', err);
                loadingEl.innerHTML = '<p class="text-danger">Error loading data. Check that Firebase is configured.</p>';
            }
        }

        // Load navbar
        fetch('../navbar.html')
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('navbar-container');
                container.innerHTML = html;
                // Admin-specific navbar adjustments
                const nav = container.querySelector('.nav');
                if (nav) {
                    nav.classList.add('admin-nav');
                    // Change Dashboard link to Admin and show it
                    const dashboardLink = nav.querySelector('.nav__dashboard-link');
                    if (dashboardLink) {
                        dashboardLink.innerHTML = '<i class="bi bi-shield-lock"></i> Admin';
                        dashboardLink.style.display = 'inline-flex';
                        dashboardLink.href = '#'; // Admin page, no dashboard to link to
                    }
                }
            })
            .catch(err => console.error('Failed to load navbar:', err));
    </script>
</body>

</html>
