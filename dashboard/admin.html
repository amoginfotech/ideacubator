<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ideacubator</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="../ideacubator.css" rel="stylesheet">

    <style>
        .stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card .number {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-card .label {
            font-size: .85rem;
            color: var(--text-muted);
        }

        .table-dark {
            --bs-table-bg: var(--bg-elevated);
            --bs-table-border-color: var(--border);
        }

        .bg-info {
            --bs-bg-opacity: 0.2;
            background-color: #0dcaf0 !important;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
    </style>
</head>

<body>

    <!-- LOGIN FORM (shown if not authenticated) -->
    <div id="loginForm" class="login-container" style="display: none;">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Admin Login</h3>
                <form id="adminLogin">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn--primary w-100">Login</button>
                    <div class="mt-3 small text-muted text-center">
                        Contact the system administrator for credentials.
                    </div>
                </form>
                <div id="loginError" class="alert alert-danger mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD (shown if authenticated) -->
    <div id="dashboard" style="display: none;">
        <!-- NAVBAR CONTAINER -->
        <div id="navbar-container"></div>

        <!-- DASHBOARD CONTENT -->
        <div class="container py-4">
            <div class="row">
                <div class="col-12">
                    <h1 class="section__title mb-4">Admin Dashboard</h1>

                    <!-- Loading State -->
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Loading data...</p>
                    </div>

                    <!-- Stats Row -->
                    <div class="row g-3 mb-4" id="statsRow" style="display: none;">
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statApplications">0</div>
                                <div class="label">Total Applications</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statInvestors">0</div>
                                <div class="label">Investor Inquiries</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statPending">0</div>
                                <div class="label">Pending Reviews</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="number" id="statApproved">0</div>
                                <div class="label">Approved (This Month)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist" style="display: none;">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="applications-tab" data-bs-toggle="tab" data-bs-target="#applications" type="button">Applications</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="investors-tab" data-bs-toggle="tab" data-bs-target="#investors" type="button">Investor Inquiries</button>
                        </li>
                    </ul>

                    <!-- Tab Content -->
                    <div class="tab-content" id="adminTabContent" style="display: none;">
                        <!-- Applications Tab -->
                        <div class="tab-pane fade show active" id="applications" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-dark table-hover table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Profile</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="applicationsTableBody">
                                                <!-- Populated by JS -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Investors Tab -->
                        <div class="tab-pane fade" id="investors" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-dark table-hover table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Company</th>
                                                    <th>Range</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="investorsTableBody">
                                                <!-- Populated by JS -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Detail Modal -->
    <div class="modal fade" id="appDetailModal" tabindex="-1" aria-labelledby="appDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="appDetailModalLabel">Application Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="appDetailContent">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        .application-details table {
            margin-bottom: 1rem;
        }
        .application-details table td:first-child {
            background: rgba(255,255,255,0.05);
            border-right: 1px solid var(--border);
        }
        pre {
            background: #1a1a1a !important;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
    </style>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../ideacubator.js"></script>
    <script>
        // Initialize Firebase if not already
        if (!firebase.apps.length) {
            firebase.initializeApp({
                apiKey: "AIzaSyDHPuZ7fAXInpVSPF5Ki7qJwBYfRUlJ2A4",
                authDomain: "rational-world-330006.firebaseapp.com",
                projectId: "rational-world-330006",
                storageBucket: "rational-world-330006.firebasestorage.app",
                messagingSenderId: "115200442212",
                appId: "1:115200442212:web:b2cd9d4d48738da9ed4471"
            });
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Admin authentication via Email/Password with Firebase Custom Claims
        // Admin users must have the custom claim `admin: true` set via Cloud Functions
        // See functions/src/index.ts for setAdminClaim function

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const dashboard = document.getElementById('dashboard');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const loadingEl = document.getElementById('loading');
        const statsRow = document.getElementById('statsRow');
        const adminTabs = document.getElementById('adminTabs');
        const adminTabContent = document.getElementById('adminTabContent');
        const applicationsTableBody = document.getElementById('applicationsTableBody');
        const investorsTableBody = document.getElementById('investorsTableBody');
        const appDetailModal = new bootstrap.Modal(document.getElementById('appDetailModal'));
        const appDetailContent = document.getElementById('appDetailContent');

        // Auth State
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // User is authenticated, show dashboard
                showDashboard();
            } else {
                // No user, show login
                showLogin();
            }
        });

        // Login form submit (Firebase Email/Password)
        document.getElementById('adminLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Auth state handler will check whitelist and show dashboard if authorized
            } catch (err) {
                loginError.textContent = err.message || 'Login failed';
                loginError.style.display = 'block';
            }
        });

        // Logout
        logoutBtn?.addEventListener('click', async () => {
            await auth.signOut();
            showLogin();
        });

        function showLogin() {
            loginForm.style.display = 'block';
            dashboard.style.display = 'none';
            loginError.style.display = 'none';
        }

        function showDashboard() {
            loginForm.style.display = 'none';
            dashboard.style.display = 'block';
            loadData();
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            return timestamp.toDate().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function getStatusBadge(status) {
            const badges = {
                'submitted': 'bg-info',
                'under_review': 'bg-warning text-dark',
                'meeting_scheduled': 'bg-primary',
                'due_diligence': 'bg-primary',
                'approved': 'bg-success',
                'rejected': 'bg-danger',
                'invested': 'bg-success',
                'incubation': 'bg-info',
                'closed': 'bg-secondary'
            };
            const label = status ? status.replace('_', ' ') : '-';
            return `<span class="badge ${badges[status] || 'bg-secondary'}">${label}</span>`;
        }

        async function showApplicationDetails(docId) {
            await showDetailsModal('Application Details', 'applications', docId);
        }

        async function showInvestorDetails(docId) {
            await showDetailsModal('Investor Inquiry Details', 'investorInquiries', docId);
        }

        async function showDetailsModal(title, collection, docId) {
            try {
                const doc = await firebase.firestore().collection(collection).doc(docId).get();
                if (!doc.exists) {
                    alert('Record not found');
                    return;
                }
                const data = doc.data();
                data.id = doc.id;

                // Update modal title
                document.getElementById('appDetailModalLabel').textContent = title;

                // Build a nicely formatted display
                let html = `<div class="mb-3">
                    <strong>${collection === 'applications' ? 'Application' : 'Inquiry'} ID:</strong> ${doc.id}<br>`;

                if (collection === 'applications') {
                    html += `<strong>Profile:</strong> ${data.profileSelected || 'N/A'}<br>`;
                }
                html += `<strong>Status:</strong> ${collection === 'applications' ? getStatusBadge(data.status || 'new') : getStatusBadge(data.status || 'pending')}<br>
                    <strong>Submitted:</strong> ${formatDate(data.submittedAt)}
                </div><hr><table class="table table-sm table-dark">`;

                // All fields (excluding metadata based on collection type)
                const excludedFields = collection === 'applications'
                    ? ['id', 'submittedAt', 'status', 'profileSelected', 'source']
                    : ['id', 'submittedAt', 'status', 'reviewedAt'];
                Object.keys(data).sort().forEach(key => {
                    if (!excludedFields.includes(key)) {
                        const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                        const value = Array.isArray(data[key]) ? data[key].join(', ') : (data[key] || '-');
                        html += `<tr><td style="width: 35%;"><strong>${label}:</strong></td><td>${value}</td></tr>`;
                    }
                });
                html += `</table><hr><h6>Raw Data</h6><pre class="bg-dark p-3 rounded" style="max-height: 300px; overflow-y: auto; font-size: 0.85rem;">${JSON.stringify(data, null, 2)}</pre>`;

                appDetailContent.innerHTML = html;
                appDetailModal.show();
            } catch (err) {
                console.error(`Error loading ${collection}:`, err);
                alert('Failed to load details');
            }
        }

        async function updateApplicationStatus(appDocId, newStatus) {
            try {
                await firebase.firestore().collection('applications').doc(appDocId).update({ status: newStatus });
                alert(`Application status updated to: ${newStatus}`);
                loadData();
            } catch (err) {
                console.error('Error updating application:', err);
                alert('Failed to update application');
            }
        }

        async function updateInvestorStatus(inqDocId, status) {
            try {
                await firebase.firestore().collection('investorInquiries').doc(inqDocId).update({ status, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
                alert(`Investor ${status}`);
                loadData();
            } catch (err) {
                console.error('Error updating investor:', err);
                alert('Failed to update status');
            }
        }

        async function loadData() {
            try {
                const [appsSnap, investorsSnap] = await Promise.all([
                    firebase.firestore().collection('applications').orderBy('submittedAt', 'desc').get(),
                    firebase.firestore().collection('investorInquiries').orderBy('submittedAt', 'desc').get()
                ]);

                // Stats
                document.getElementById('statApplications').textContent = appsSnap.size;
                document.getElementById('statInvestors').textContent = investorsSnap.size;
                document.getElementById('statPending').textContent = investorsSnap.docs.filter(d => d.data().status === 'pending').size;

                // Applications table
                applicationsTableBody.innerHTML = appsSnap.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <tr>
                            <td>${formatDate(data.submittedAt)}</td>
                            <td>${data.founderName || data.founderEmail || 'Anonymous'}</td>
                            <td>${data.founderEmail || '-'}</td>
                            <td>${data.profileSelected || '-'}</td>
                            <td>
                                <select class="form-select form-select-sm" onchange="updateApplicationStatus('${doc.id}', this.value)" style="width: auto; display: inline-block;">
                                    <option value="submitted" ${data.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                                    <option value="under_review" ${data.status === 'under_review' ? 'selected' : ''}>Under Review</option>
                                    <option value="meeting_scheduled" ${data.status === 'meeting_scheduled' ? 'selected' : ''}>Meeting Scheduled</option>
                                    <option value="due_diligence" ${data.status === 'due_diligence' ? 'selected' : ''}>Due Diligence</option>
                                    <option value="approved" ${data.status === 'approved' ? 'selected' : ''}>Approved</option>
                                    <option value="rejected" ${data.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    <option value="invested" ${data.status === 'invested' ? 'selected' : ''}>Invested</option>
                                    <option value="incubation" ${data.status === 'incubation' ? 'selected' : ''}>Incubation</option>
                                    <option value="closed" ${data.status === 'closed' ? 'selected' : ''}>Closed</option>
                                </select>
                            </td>
                            <td>
                                <button class="btn btn-sm btn--outline" onclick='showApplicationDetails("${doc.id}")'>Details</button>
                            </td>
                        </tr>
                    `;
                }).join('');

                // Investors table
                investorsTableBody.innerHTML = investorsSnap.docs.map(doc => {
                    const data = doc.data();
                    return `
                        <tr>
                            <td>${formatDate(data.submittedAt)}</td>
                            <td>${data.name}</td>
                            <td>${data.email}</td>
                            <td>${data.company || '-'}</td>
                            <td>${data.investmentRange || '-'}</td>
                            <td>${getStatusBadge(data.status || 'pending')}</td>
                            <td>
                                <button class="btn btn-sm btn--outline me-1" onclick='showInvestorDetails("${doc.id}")'>Details</button>
                                ${data.status === 'pending' ? `
                                    <button class="btn btn-sm btn-success" onclick="updateInvestorStatus('${doc.id}', 'approved')">Approve</button>
                                    <button class="btn btn-sm btn-danger" onclick="updateInvestorStatus('${doc.id}', 'rejected')">Reject</button>
                                ` : '<span class="text-muted">-</span>'}
                            </td>
                        </tr>
                    `;
                }).join('');

                loadingEl.style.display = 'none';
                statsRow.style.display = 'flex';
                adminTabs.style.display = 'flex';
                adminTabContent.style.display = 'block';

            } catch (err) {
                console.error('Error loading data:', err);
                loadingEl.innerHTML = '<p class="text-danger">Error loading data. Check that Firebase is configured.</p>';
            }
        }

        // Load navbar
        fetch('../navbar.html')
            .then(response => response.text())
            .then(html => {
                const container = document.getElementById('navbar-container');
                container.innerHTML = html;
                // Admin-specific navbar adjustments
                const nav = container.querySelector('.nav');
                if (nav) {
                    nav.classList.add('admin-nav');
                    // Change Dashboard link to Admin and show it
                    const dashboardLink = nav.querySelector('.nav__dashboard-link');
                    if (dashboardLink) {
                        dashboardLink.innerHTML = '<i class="bi bi-shield-lock"></i> Admin';
                        dashboardLink.style.display = 'inline-flex';
                        dashboardLink.href = '#'; // Admin page, no dashboard to link to
                    }
                }
            })
            .catch(err => console.error('Failed to load navbar:', err));
    </script>
</body>

</html>
